name: Tomato Food Delivery - UI

on:
  workflow_dispatch:
  push:
    branches: 
      [main]
    
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # setup node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # install dependencies
      - name: Install dependencies
        run: npm install

      # build the project
      - name: Build
        run: npm run build

      # deploy the project
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
